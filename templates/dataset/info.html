{% extends "base.html" %}
{% block title %}Info {{ spec.label }}{% endblock %}

{% block content %}
  <div class="page-head mb-4">
    <div>
      <h1>Info {{ spec.label }}</h1>
      <p class="muted">{{ object }}</p>
    </div>
    <div class="page-head-actions">
      <a href="{{ edit_url }}" class="button-primary">Ubah</a>
      <a href="{{ back_url }}" class="button-outline">&larr; Kembali ke daftar</a>
    </div>
  </div>

  <dl class="dashboard-card dataset-info">
    {% for field in fields %}
      <div>
        <dt>{{ field.label }}</dt>
        <dd>{{ field.value }}</dd>
      </div>
    {% endfor %}
  </dl>
{% endblock %}
