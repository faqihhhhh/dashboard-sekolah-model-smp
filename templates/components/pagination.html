{% if page_obj.has_other_pages %}
  <nav class="flex items-center justify-between border-t border-slate-200 bg-white px-4 py-3 text-sm" aria-label="Halaman">
    <p class="text-slate-500">Halaman {{ page_obj.number }} dari {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} data</p>
    <div class="flex gap-2">
      {% if page_obj.has_previous %}
        <a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}" class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-slate-50">&larr; Sebelumnya</a>
      {% endif %}
      {% if page_obj.has_next %}
        <a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}" class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-slate-50">Berikutnya &rarr;</a>
      {% endif %}
    </div>
  </nav>
{% endif %}
