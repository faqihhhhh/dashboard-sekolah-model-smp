{% for field in form.visible_fields %}
  <div>
    {% if field.field.widget.input_type == "checkbox" %}
      <label class="flex items-center gap-2 text-sm text-slate-700">{{ field }} {{ field.label }}</label>
    {% else %}
      <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-slate-700">
        {{ field.label }}{% if field.field.required %}<span class="text-red-500"> *</span>{% endif %}
      </label>
      {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="mt-1 text-xs text-slate-500">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<p class="mt-1 text-xs text-red-600">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
